name: ci-cd
on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: public.ecr.aws/${{ vars.ECR_PUBLIC_ALIAS }}/docqa-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
        env:
          GROQ_API_KEY: test-key

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull public.ecr.aws/${{ vars.ECR_PUBLIC_ALIAS }}/docqa-api:${{ github.sha }}
            docker rm -f docqa || true
            docker run -d --name docqa --restart unless-stopped \
              --env-file /opt/docqa/.env -p 80:8000 \
              public.ecr.aws/${{ vars.ECR_PUBLIC_ALIAS }}/docqa-api:${{ github.sha }}
            sleep 8
            curl -fsS http://localhost:80/health
            docker image prune -f